<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gita Scroll · One verse of the Gita every morning</title>
<meta name="description" content="One verse of the Gita every morning, in your language, with the Sanskrit shlok above it. 12 Indian languages, free, no ads.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Gita Scroll">
<meta property="og:title" content="Gita Scroll · One verse of the Gita every morning">
<meta property="og:description" content="In your language, with the Sanskrit shlok above it. 12 Indian languages · free · no ads.">
<meta property="og:image" content="https://gitascroll.in/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Serif:wght@600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6EC;--card:#fff;--text:#2A0D0F;--text2:#6B4E3A;--gold:#8E2A1C;--btn:#8E2A1C;--btnText:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#170A0B;--card:#22110F;--text:#F6EAD0;--text2:#CDB89A;--gold:#E2B35A;--btn:#E2B35A;--btnText:#241008}}
:root[data-theme="dark"]{--bg:#170A0B;--card:#22110F;--text:#F6EAD0;--text2:#CDB89A;--gold:#E2B35A;--btn:#E2B35A;--btnText:#241008}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:18px/1.6 "Noto Sans","Noto Sans Devanagari",-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
main{max-width:440px;width:100%;padding:32px 16px;text-align:center}
.mark{color:var(--gold);font-weight:600;letter-spacing:.02em;font-size:20px;margin:0 0 20px}
h1{font-family:"Noto Serif",Georgia,serif;font-size:30px;line-height:1.25;margin:0 0 10px;font-weight:600}
.hi{font-family:"Noto Sans Devanagari",sans-serif;font-size:17px}
p{margin:0 0 20px;color:var(--text2)}
.btn{display:block;width:100%;padding:16px;border-radius:14px;background:var(--btn);color:var(--btnText);font-weight:600;font-size:19px;text-decoration:none;margin:0 0 12px}
.note{font-size:15px}
#status{min-height:1.6em}
</style>
</head>
<body>
<main>
  <p class="mark">Gita Scroll</p>
  <h1>One verse of the Gita every morning, in your language</h1>
  <p class="hi" lang="hi">हर सुबह गीता का एक श्लोक, आपकी भाषा में</p>
  <a id="play" class="btn" href="https://play.google.com/store/apps/details?id=com.gitascroll.app">Get it on Google Play</a>
  <p id="status" class="note"></p>
  <p class="note"><a href="../" style="color:var(--gold)">About Gita Scroll</a></p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  function ok(v, re) { return v && re.test(v) ? v : null; }
  var verse = ok(q.get('v'), /^\d{1,2}\.\d{1,2}$/);
  var lang = ok(q.get('l'), /^[a-z]{2}(-[A-Za-z]{4})?$/);
  var morning = q.get('m') === '1';
  // ?s= names where a link that isn't a share caption was put: poster, card (table card), channel, yt, fb, film, site.
  var SOURCES = { poster: 'offline', card: 'offline', channel: 'social', yt: 'social', fb: 'social', film: 'social', site: 'web' };
  var src = ok(q.get('s'), /^[a-z]{2,10}$/);
  var medium = src && SOURCES[src] ? SOURCES[src] : null;
  var ref = (medium ? 'utm_source=' + src + '&utm_medium=' + medium : 'utm_source=whatsapp&utm_medium=share') + (verse ? '&utm_content=' + verse : '') + (lang ? '&gs_lang=' + lang : '') + (morning ? '&gs_morning=1' : '');
  var play = 'https://play.google.com/store/apps/details?id=com.gitascroll.app&referrer=' + encodeURIComponent(ref);
  document.getElementById('play').href = play;
  var ua = navigator.userAgent || '';
  if (/Android/i.test(ua)) {
    document.getElementById('status').textContent = 'Opening Google Play…';
    location.replace(play);
  } else if (/iPhone|iPad|iPod/i.test(ua)) {
    document.getElementById('status').textContent = 'The iPhone version is coming soon. On Android, open this link on your phone.';
  }
})();
</script>
</body>
</html>
