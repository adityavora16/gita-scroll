<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gita Scroll</title>
<meta name="description" content="Gita Scroll: the Bhagavad Gita, one verse at a time.">
<style>
:root{--bg:#fff;--text:#1d1b19;--text2:#5b5650;--line:#e4dfd8;--accent:#b4501e;--tint:#fbf1ea;--mark:#fff1a8}
@media (prefers-color-scheme:dark){:root{--bg:#151412;--text:#f2eee9;--text2:#bdb6ad;--line:#35312c;--accent:#f0a070;--tint:#26221e;--mark:#5a4b00}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
nav{max-width:720px;margin:0 auto;padding:16px 16px 0;font-size:15px}
nav a{margin-right:16px}
a{color:var(--accent)}
h1{font-size:30px;line-height:1.25;margin:24px 0 8px}
h2{font-size:21px;line-height:1.3;margin:36px 0 8px}
h3{font-size:18px;margin:24px 0 6px}
p,li{margin:0 0 12px}
ul{padding-left:22px}
code{background:var(--tint);padding:1px 5px;border-radius:4px;font-size:.92em}
table{border-collapse:collapse;width:100%;margin:12px 0 20px;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--tint)}
.wrap{overflow-x:auto}
mark{background:var(--mark);color:var(--text);padding:0 3px;border-radius:3px}
footer{max-width:720px;margin:0 auto;padding:0 16px 40px;color:var(--text2);font-size:14px}
</style>
</head>
<body>
<nav><a href="./">Gita Scroll</a><a href="privacy.html">Privacy policy</a><a href="terms.html">Terms of use</a></nav>
<main>
<h1>Gita Scroll</h1>
<p>The Bhagavad Gita, one verse at a time, chosen for what is on your mind. An app for iPhone and Android.</p>

<h2>Contact</h2>
<p>Questions, corrections to a verse, or a privacy request: adityavora16@gmail.com</p>
</main>
<footer>Gita Scroll</footer>
</body>
</html>
